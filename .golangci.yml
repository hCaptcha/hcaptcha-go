version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - revive
    - staticcheck
    - unconvert
    - unparam
  exclusions:
    rules:
      # Test-only TLS handlers parse bounded, in-memory request bodies.
      - path: _test\.go
        text: G120
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
